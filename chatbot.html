<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Career Assistant | CareerPilot AI</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #080b1a;
            color: white;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 6%;
            background: #0d1128;
            border-bottom: 1px solid #252c4d;
        }

        .logo {
            color: #00e5ff;
            font-size: 22px;
            font-weight: bold;
        }

        .nav-buttons {
            display: flex;
            gap: 12px;
        }

        .nav-button {
            text-decoration: none;
            color: white;
            background: #252c4d;
            padding: 9px 15px;
            border-radius: 8px;
        }

        .container {
            width: 92%;
            max-width: 900px;
            margin: 40px auto;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 38px;
        }

        .header span {
            color: #00e5ff;
        }

        .header p {
            color: #aeb3c8;
        }

        .chat-card {
            background: #111631;
            border: 1px solid #252c4d;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        .chat-header {
            padding: 18px 22px;
            background: #151b3d;
            border-bottom: 1px solid #252c4d;
        }

        .bot-status {
            color: #61ff9b;
            font-size: 14px;
        }

        .chat-box {
            height: 450px;
            overflow-y: auto;
            padding: 22px;
        }

        .message {
            display: flex;
            margin-bottom: 18px;
            animation: messageIn 0.3s ease;
        }

        .message.user {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 75%;
            padding: 13px 16px;
            border-radius: 15px;
            line-height: 1.6;
        }

        .bot .bubble {
            background: #252c4d;
            color: #e8eaf2;
            border-bottom-left-radius: 4px;
        }

        .user .bubble {
            background: #00e5ff;
            color: #07101c;
            border-bottom-right-radius: 4px;
        }

        .typing {
            color: #aeb3c8;
            font-style: italic;
            display: none;
            padding: 10px;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 18px;
            border-top: 1px solid #252c4d;
        }

        #userInput {
            flex: 1;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #252c4d;
            background: #080b1a;
            color: white;
            outline: none;
            font-size: 15px;
        }

        #userInput:focus {
            border-color: #00e5ff;
        }

        #sendButton {
            border: none;
            padding: 0 22px;
            border-radius: 10px;
            background: #00e5ff;
            color: #07101c;
            font-weight: bold;
            cursor: pointer;
        }

        #sendButton:hover {
            transform: translateY(-2px);
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 0 18px 18px;
        }

        .suggestion {
            border: 1px solid #252c4d;
            background: #080b1a;
            color: #c8ccda;
            padding: 9px 12px;
            border-radius: 20px;
            cursor: pointer;
        }

        .suggestion:hover {
            border-color: #00e5ff;
            color: #00e5ff;
        }

        @keyframes messageIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media(max-width:600px) {

            .header h1 {
                font-size: 29px;
            }

            .chat-box {
                height: 400px;
            }

            .input-area {
                flex-direction: column;
            }

            #sendButton {
                padding: 13px;
            }

            .bubble {
                max-width: 90%;
            }
        }

    </style>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/app-enhancements.css') }}">
    <script src="{{ url_for('static', filename='css/app-enhancements.js') }}" defer></script>

</head>


<body>


<nav class="navbar">

    <div class="logo">
        🚀 CareerPilot AI
    </div>

    <div class="nav-buttons">

        <a href="{{ url_for('dashboard') }}"
           class="nav-button">

            Dashboard

        </a>

        <a href="{{ url_for('logout') }}"
           class="nav-button">

            Logout

        </a>

    </div>

</nav>


<div class="container">


    <div class="header">

        <h1>
            🤖 AI Career
            <span>Assistant</span>
        </h1>

        <p>
            Ask questions about your career,
            skills, courses and roadmap.
        </p>

    </div>


    <div class="chat-card">


        <div class="chat-header">

            <strong>
                🚀 CareerPilot AI Assistant
            </strong>

            <div class="bot-status">
                ● Online
            </div>

        </div>


        <div id="chatBox"
             class="chat-box">

            <div class="message bot">

                <div class="bubble">

                    👋 Hi {{ name }}!

                    <br><br>

                    I'm your CareerPilot AI Assistant.
                    Ask me anything about your career journey.

                </div>

            </div>

        </div>


        <div id="typing"
             class="typing">

            🤖 CareerPilot AI is thinking...

        </div>


        <div class="suggestions">

            <button
                class="suggestion"
                onclick="askSuggestion(this)">

                What skills should I learn?

            </button>

            <button
                class="suggestion"
                onclick="askSuggestion(this)">

                How can I prepare for interviews?

            </button>

            <button
                class="suggestion"
                onclick="askSuggestion(this)">

                What course should I take?

            </button>

            <button
                class="suggestion"
                onclick="askSuggestion(this)">

                How can I get a job?

            </button>

        </div>


        <div class="input-area">

            <input
                type="text"
                id="userInput"
                placeholder="Ask your career question..."
                autocomplete="off">

            <button
                id="sendButton"
                onclick="sendMessage()">

                Send 🚀

            </button>

        </div>


    </div>


</div>


<script>

const input =
    document.getElementById("userInput");

const chatBox =
    document.getElementById("chatBox");

const typing =
    document.getElementById("typing");


input.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            sendMessage();

        }

    }
);


function addMessage(
    message,
    type
) {

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message " + type;


    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    bubble.textContent =
        message;


    wrapper.appendChild(bubble);

    chatBox.appendChild(wrapper);

    chatBox.scrollTop =
        chatBox.scrollHeight;

}


function askSuggestion(button) {

    input.value =
        button.textContent.trim();

    sendMessage();

}


let sendingMessage = false;

function sendMessage() {

    const message = input.value.trim();

    if (!message || sendingMessage) return;

    sendingMessage = true;
    const sendButton = document.getElementById("sendButton");
    sendButton.disabled = true;
    sendButton.textContent = "Sending…";


    addMessage(
        message,
        "user"
    );


    input.value = "";

    typing.style.display =
        "block";


    fetch(
        "{{ url_for('chatbot') }}",
        {

            method: "POST",

            headers: {
                "Content-Type":
                    "application/json"
            },

            body: JSON.stringify({
                message: message
            })

        }
    )

    .then(async response => {
        const data = await response.json();
        if (!response.ok) throw new Error(data.reply || "Request failed");
        return data;
    })

    .then(data => {
        typing.style.display = "none";
        addMessage(data.reply || "I couldn't create a reply. Please try again.", "bot");
    })

    .catch(error => {

        console.error(error);

        typing.style.display = "none";
        addMessage("Sorry, something went wrong. Please try again.", "bot");
    })
    .finally(() => {
        sendingMessage = false;
        sendButton.disabled = false;
        sendButton.textContent = "Send 🚀";
        input.focus();
    });

}

</script>


</body>

</html>
