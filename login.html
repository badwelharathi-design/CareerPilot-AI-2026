<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | CareerPilot AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/app-enhancements.css') }}">
    <script src="{{ url_for('static', filename='css/app-enhancements.js') }}" defer></script>

</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-icon">
            🚀
        </div>

        <h1>
            Welcome Back
        </h1>

        <p>
            Login to CareerPilot AI
        </p>


        <!-- ERROR -->

        {% if error %}

        <div class="error-message">
            {{ error }}
        </div>

        {% endif %}


        <!-- LOGIN FORM -->

        <form method="POST"
              action="{{ url_for('login') }}">

            <input
                type="email"
                name="email"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login 🚀
            </button>

        </form>


        <p class="switch">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Create Account
            </a>

        </p>


        <a href="{{ url_for('home') }}">
            ← Back to Home
        </a>

    </div>

</div>

</body>

</html>
