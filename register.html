<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register | CareerPilot AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/app-enhancements.css') }}">
    <script src="{{ url_for('static', filename='css/app-enhancements.js') }}" defer></script>

</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-icon">
            🎯
        </div>

        <h1>
            Create Account
        </h1>

        <p>
            Start your career journey
        </p>


        {% if error %}

        <div class="error-message">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST"
              action="{{ url_for('register') }}">

            <input
                type="text"
                name="name"
                placeholder="Full Name"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Create Password"
                minlength="6"
                required
            >

            <button type="submit">
                Create Account ✨
            </button>

        </form>


        <p class="switch">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </p>


        <a href="{{ url_for('home') }}">
            ← Back to Home
        </a>

    </div>

</div>

</body>

</html>
